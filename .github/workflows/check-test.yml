name: check test

on: pull_request

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: grant execute permission for gradle wrapper
        run: chmod +x ./gradlew

      - name: build with gradle wrapper
        run: ./gradlew test
